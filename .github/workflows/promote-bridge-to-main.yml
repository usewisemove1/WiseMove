# .github/workflows/promote-bridge-to-main.yml
name: Promote bridge to main

on:
  push:
    branches:
      - bridge

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create or find pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head bridge \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head bridge \
              --title "Promote bridge to main" \
              --body "Automatically created after new changes were added to bridge.")

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --json number \
              --jq '.number')
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for pull request checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Ignore this workflow's own check to avoid waiting on ourselves.
          IGNORE_CHECK_PREFIX: "Promote bridge to main"
        run: |
          echo "Waiting for external checks on PR #$PR_NUMBER..."

          for i in $(seq 1 120); do
            CHECKS_JSON=$(gh pr checks "$PR_NUMBER" --json name,state,bucket 2>/tmp/pr-checks.err || true)

            if [ -z "$CHECKS_JSON" ] || [ "$CHECKS_JSON" = "[]" ]; then
              echo "No checks yet (attempt $i/120)..."
              sleep 15
              continue
            fi

            echo "$CHECKS_JSON" | jq -r --arg ignore "$IGNORE_CHECK_PREFIX" '
              map(select(.name | startswith($ignore) | not))
              | .[]
              | "[\(.bucket)] \(.name)"
            '

            STATUS=$(echo "$CHECKS_JSON" | jq -r --arg ignore "$IGNORE_CHECK_PREFIX" '
              map(select(.name | startswith($ignore) | not)) as $checks
              | if ($checks | length) == 0 then
                  "waiting_for_external"
                elif ($checks | map(select(.bucket == "fail")) | length) > 0 then
                  "FAILED"
                elif ($checks | map(select(.bucket == "pending")) | length) > 0 then
                  "PENDING"
                else
                  "READY"
                end
            ')

            echo "status=$STATUS (attempt $i/120)"

            case "$STATUS" in
              READY)
                echo "All external checks passed."
                exit 0
                ;;
              FAILED)
                echo "One or more required checks failed."
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "Timed out waiting for external checks on PR #$PR_NUMBER"
          cat /tmp/pr-checks.err || true
          exit 1

      - name: Merge pull request
        env:
          # Use a user PAT so the merge commit is authored by the Vercel Hobby
          # project owner, not github-actions[bot].
          GH_TOKEN: ${{ secrets.BRIDGE_MERGE_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --merge \
            --delete-branch=false
